# Table of Contents
# Learn more at https://jupyterbook.org/customize/toc.html

format: jb-book
root: intro
title: Home

parts:
  - caption: Getting Started
    chapters:
      - file: getting_started/installation
      - file: getting_started/authentication
      - file: getting_started/quick_start
      - file: getting_started/roi_options

  # Tutorials are grouped by subject, not by how advanced they are, and each
  # group matches a class of the library wherever one exists. Water quality and
  # nighttime lights are the two that have no class of their own — they are
  # applications of NdviSeasonality and TimeSeriesAnalyzer — so they are filed
  # by what they are about, which is where a reader looks for them.
  #
  # Every subject is meant to end up as one executed notebook. The prose pages
  # that still walk through a class are being dissolved into their notebook,
  # with the options and caveats moving to Reference.
  - caption: Composites and indices
    chapters:
      - file: notebooks/01_basic_usage
        title: "Basic Usage"
      - file: tutorials/basic_ndvi
        title: "Basic NDVI Analysis"
      - file: advanced/export_options
        title: "Export & Batch Processing"

  - caption: Vegetation and phenology
    chapters:
      - file: advanced/time_series
        title: "Time Series Analysis"
      - file: notebooks/03_time_series_analysis
        title: "Point Phenology and Trends (Ebro Delta)"
      - file: notebooks/06_stable_pixels
        title: "Stable Pixels & PIF Selection (Doñana)"

  - caption: Land cover classification
    chapters:
      - file: advanced/classification
        title: "Land Cover Classification"
      - file: notebooks/07_multisensor_classification
        title: "Multi-sensor Classification (Tawau Hills)"
      - file: notebooks/08_unsupervised_forest
        title: "Unsupervised Clustering (Tawau Hills)"

  - caption: Water
    chapters:
      - file: advanced/hydroperiod
        title: "Hydroperiod Analysis"
      - file: notebooks/05_hydroperiod
        title: "Hydroperiod (Doñana)"
      - file: advanced/water_quality
        title: "Water Quality Monitoring"
      - file: notebooks/10_water_quality_reservoirs
        title: "Water Quality in Reservoirs (Guadalquivir)"

  - caption: Radar
    chapters:
