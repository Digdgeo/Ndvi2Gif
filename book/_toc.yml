# Table of Contents
# Learn more at https://jupyterbook.org/customize/toc.html

format: jb-book
root: intro
title: Home

parts:
  - caption: Getting Started
    chapters:
      - file: getting_started/installation
      - file: getting_started/authentication
      - file: getting_started/quick_start
      - file: getting_started/roi_options

  # One section per topic. Each one opens with the page that explains the
  # class and its options, and hangs its executed notebooks underneath: a
  # reader looks for a subject, not for a file format
  - caption: Tutorials
    chapters:
      - file: tutorials/basic_ndvi
        title: "Basic NDVI Analysis"
        sections:
          - file: notebooks/01_basic_usage
            title: "Notebook: Basic Usage"
      - file: tutorials/climate_analysis
        title: "Climate Data (ERA5 & CHIRPS)"
      - file: advanced/sar_processing
        title: "Sentinel-1 SAR Processing"
      - file: advanced/time_series
        title: "Time Series Analysis"
        sections:
          - file: notebooks/03_time_series_analysis
            title: "Notebook: Time Series Analysis"
          - file: notebooks/06_stable_pixels
            title: "Notebook: Stable Pixels & PIF Selection"
      - file: advanced/classification
        title: "Land Cover Classification"
        sections:
          - file: notebooks/02_landcover_classification
            title: "Notebook: Land Cover Classification (Córdoba)"
          - file: notebooks/07_multisensor_classification
            title: "Notebook: Multi-sensor Classification (Tawau Hills)"
      - file: advanced/hydroperiod
        title: "Hydroperiod Analysis"
        sections:
          - file: notebooks/05_hydroperiod
            title: "Notebook: Hydroperiod (Doñana)"
      - file: advanced/water_quality
        title: "Water Quality Monitoring"
        sections:
          - file: notebooks/10_water_quality_reservoirs
            title: "Notebook: Chlorophyll Peaks in Reservoirs (Guadalquivir)"
      - file: notebooks/09_nighttime_lights
        title: "Nighttime Lights (Seville & the Andalusian coast)"
      - file: advanced/export_options
        title: "Export & Batch Processing"

  - caption: Reference
    chapters:
      - file: reference/api
      - file: reference/indices
      - file: reference/datasets
      - file: reference/faq
      - file: reference/changelog
      - file: reference/contributing
