[pytest]
minversion = 7.0
addopts = -ra -q
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marca para pruebas que requieren Earth Engine
markers =
    ee: tests requiring Google Earth Engine authentication

# Silenciar warnings ruidosos (matplotlib/seaborn/pandas)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:.*tight_layout.*:UserWarning
    ignore:.*findfont.*:UserWarning
    ignore:.*Glyph.*missing.*:UserWarning
