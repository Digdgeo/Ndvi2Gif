{% set name = "ndvi2gif" %}
{% set version = "1.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: python -m pip install .

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - numpy >=1.24
    - pandas
    - scipy
    - matplotlib
    - seaborn
    - pillow
    - imageio
    - tqdm
    - requests
    - geemap >=0.29.5
    - earthengine-api >=0.1.347
    - geopandas
    - fiona
    - pycrs
    - deims >=4.0
    - statsmodels >=0.13
    - scikit-learn >=1.0

about:
  home: https://github.com/Digdgeo/Ndvi2Gif
  license: MIT
  license_file: ../LICENSE
  summary: Multi-seasonal remote sensing analysis suite with Google Earth Engine
  description: |
    Ndvi2Gif is a Python library for multi-temporal remote sensing analysis with
    Google Earth Engine. It provides seasonal compositing, 40+ vegetation and
    environmental indices, SAR preprocessing, time series analytics, land cover
    classification, and hydroperiod analysis — all server-side.
  doc_url: https://digdgeo.github.io/Ndvi2Gif/
  dev_url: https://github.com/Digdgeo/Ndvi2Gif

extra:
  recipe-maintainers:
    - Digdgeo
